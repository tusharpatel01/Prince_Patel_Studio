# Optional Render Blueprint for the API. You can also set the same values by hand in any Node host.
services:
  - type: web
    name: prince-patel-studio-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: BRAND_NAME
        value: Prince Patel
